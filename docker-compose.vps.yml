services:
  ca7m4x9q2v:
    container_name: ca7m4x9q2v_app
    image: ghcr.io/mr-devloper005/cabanalaemilia.com:latest
    env_file:
      - .env
    network_mode: bridge
    restart: always
    ports:
      - "127.0.0.1:3075:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5m
      timeout: 3s
      retries: 2
